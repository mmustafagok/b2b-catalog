# CatalogFlow: B2B Order Catalog
# Shopify App Configuration (API Version 2026-07)
# Note: In production or development via Shopify CLI, application_url and redirect_urls
# are dynamically configured by `shopify app dev` or your deployment host.

client_id = "catalogflow-b2b-portal"
name = "CatalogFlow: B2B Order Catalog"
handle = "catalogflow-b2b-portal"
application_url = "https://app.catalogflow.io"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""

[access_scopes]
scopes = "read_products,read_inventory,write_draft_orders,read_draft_orders"

[auth]
redirect_urls = [
  "https://app.catalogflow.io/auth/callback"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = [ "products/create", "products/update", "products/delete" ]
uri = "/api/webhooks/products"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/api/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request" ]
uri = "/api/webhooks/compliance/customers-data-request"

[[webhooks.subscriptions]]
compliance_topics = [ "customers/redact" ]
uri = "/api/webhooks/compliance/customers-redact"

[[webhooks.subscriptions]]
compliance_topics = [ "shop/redact" ]
uri = "/api/webhooks/compliance/shop-redact"
